name: AutoMeat Control Plane CI

on:
  push:
    paths:
      - 'automeat-control-plane/**'
      - '.github/workflows/automeat-control-plane.yml'
  pull_request:
    paths:
      - 'automeat-control-plane/**'
      - '.github/workflows/automeat-control-plane.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automeat-control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: automeat-control-plane/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
